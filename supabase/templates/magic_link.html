<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f5f5f4; color: #1c1917; font-family: Arial, sans-serif;">
    <div style="margin: 0 auto; max-width: 560px; padding: 40px 24px;">
      <div style="border: 1px solid #e7e5e4; border-radius: 20px; background: #ffffff; padding: 32px;">
        <p style="margin: 0; color: #b45309; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;">
          CamNook
        </p>
        <h1 style="margin: 24px 0 0; font-size: 28px; line-height: 1.2;">Your sign-in code</h1>
        <p style="margin: 16px 0 0; color: #57534e; font-size: 16px; line-height: 1.6;">
          Enter this one-time code in CamNook. It can only be used once.
        </p>
        <p style="margin: 28px 0; font-family: monospace; font-size: 32px; font-weight: 700; letter-spacing: 0.24em;">
          {{ .Token }}
        </p>
        <p style="margin: 0; color: #78716c; font-size: 14px; line-height: 1.6;">
          If you did not request this code, you can safely ignore this email. Never share the code with anyone.
        </p>
      </div>
    </div>
  </body>
</html>
