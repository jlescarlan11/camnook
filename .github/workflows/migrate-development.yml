name: Migrate Development

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-development
  cancel-in-progress: false

jobs:
  migrate:
    name: Push and verify Development
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      EXPECTED_PROJECT_ID: ekmoiepalelqpmemvrkl
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Refuse an unexpected project
        run: test "$SUPABASE_PROJECT_ID" = "$EXPECTED_PROJECT_ID"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Link Development
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked

      - name: Verify migration history
        run: supabase migration list --linked

      - name: Run hosted fail-closed and RLS checks
        run: bash scripts/run-hosted-database-tests.sh --target development

      - name: Run hosted security advisors
        run: supabase db advisors --linked --type security --level warn --fail-on error
