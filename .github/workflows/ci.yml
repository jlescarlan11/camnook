name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-and-database:
    name: Application and database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder
      CRON_SECRET: ci-placeholder-not-used-outside-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Validate hosted database test policy
        run: node scripts/hosted-database-test-policy.mjs validate-manifest

      - name: Start and reset local Supabase
        run: |
          supabase start
          supabase db reset

      - name: Run Supabase-backed database tests
        # 001 and 004 intentionally model Storage API deletion at the SQL
        # boundary and run in the disposable PostgreSQL harness below. Hosted
        # Storage blocks direct table deletion with protect_delete().
        run: >-
          supabase test db
          supabase/tests/database/002_pricing_and_approval.sql
          supabase/tests/database/005_verification_policy_disabled.sql
          supabase/tests/database/006_hosted_verification_rls.sql
          supabase/tests/database/008_contract_lifecycle.sql
          supabase/tests/database/009_manual_gcash_reconciliation.sql
          supabase/tests/database/010_pickup_active_rental.sql
          supabase/tests/database/011_return_cancellation_resolution.sql
          supabase/tests/database/012_owner_operations_portfolio_reporting.sql
          supabase/tests/database/013_camera_handoff_policies.sql
          supabase/tests/database/014_handoff_schedule_booking_flow.sql
          supabase/tests/database/015_booking_meetup_plans.sql

      - name: Generate database types for validation
        # Local and hosted PostgREST versions can order equivalent definitions
        # differently. The type-check below compiles the app against this fresh
        # migration-derived output instead of comparing formatting byte-for-byte.
        run: supabase gen types typescript --local --schema public,api > src/types/database.generated.ts

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Verify Production launch evidence
        run: pnpm launch:verify

      - name: Build
        run: pnpm build

  database-concurrency:
    name: Database concurrency
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PostgreSQL 17
        run: brew install postgresql@17

      - name: Run real-session concurrency tests
        run: bash supabase/tests/database/003_approval_concurrency.sh
