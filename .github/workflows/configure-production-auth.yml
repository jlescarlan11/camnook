name: Configure Production Auth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-production-auth
  cancel-in-progress: false

jobs:
  configure:
    name: Configure and verify free Resend SMTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure fixed Production Auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if ! response="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --retry 0 \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              https://camnook.shop/api/internal/configure-auth-smtp
          )"; then
            echo "::error::Production Auth configuration outcome is indeterminate; reconcile hosted Auth before any retry."
            exit 1
          fi
          jq -e '
            .customSmtpEnabled == true and
            .provider == "resend" and
            .passwordAuthenticationUsedByApplication == false and
            .leakedPasswordProtectionApplicable == false and
            .passwordMinimumLength == 15
          ' <<<"$response" >/dev/null
          echo "Production Auth uses Resend SMTP and CamNook remains passwordless."
